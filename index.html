<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未来科学城 - 科技成果转化对接平台</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Toast 提示框容器 -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        <div id="liveToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">操作成功！</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- AI 智能匹配弹窗 (新增) -->
    <div class="modal fade" id="aiMatchModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-primary text-white border-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-cpu"></i> AI 智能匹配分析报告</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body bg-light">
                    <div class="mb-3 text-muted small">针对需求：<span id="ai-target-demand" class="fw-bold text-dark"></span></div>
                    <h6 class="fw-bold text-primary mb-3"> TOP 3 推荐高校成果</h6>
                    <div id="ai-match-results" class="row g-3">
                        <!-- JS 动态注入匹配结果 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 核心布局 -->
    <div class="d-flex flex-column flex-md-row" style="min-height: 100vh;">
        
        <!-- 侧边栏 -->
        <div class="sidebar bg-dark text-white p-3 d-flex flex-md-column shadow">
            <div class="sidebar-header border-bottom border-secondary mb-md-3 pb-md-3 me-3 me-md-0 d-flex align-items-center justify-content-center">
                <h5 class="fw-bold mb-0 text-nowrap">
                    <i class="bi bi-rocket-takeoff text-primary me-2"></i>科技转化
                </h5>
            </div>
            <ul class="nav nav-pills flex-row flex-md-column mb-md-auto gap-2 sidebar-nav">
                <li class="nav-item"><a href="#" class="nav-link active" onclick="switchView('home', this)"><i class="bi bi-house-door me-1"></i> 平台大厅</a></li>
                <li><a href="#" class="nav-link text-white" onclick="switchView('uni', this)"><i class="bi bi-mortarboard me-1"></i> 高校端</a></li>
                <li><a href="#" class="nav-link text-white" onclick="switchView('soe', this)"><i class="bi bi-building me-1"></i> 央企端</a></li>
                <li><a href="#" class="nav-link text-white" onclick="switchView('gov', this)"><i class="bi bi-speedometer2 me-1"></i> 管委会</a></li>
            </ul>
        </div>

        <!-- 右侧主体内容 -->
        <div class="flex-grow-1 p-3 p-md-4 main-content w-100">
            
            <!-- 1. 首页大厅 -->
            <div id="view-home" class="view-section fade-in">
                <h4 class="mb-4 fw-bold"><i class="bi bi-grid-fill text-primary me-2"></i>欢迎进入协同转化生态</h4>
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3"><div class="card bg-primary text-white border-0 shadow-sm h-100"><div class="card-body p-3"><h6 class="text-white-50 small">入驻央企需求</h6><h3 class="mb-0">132 <small class="fs-6">项</small></h3></div></div></div>
                    <div class="col-6 col-md-3"><div class="card bg-success text-white border-0 shadow-sm h-100"><div class="card-body p-3"><h6 class="text-white-50 small">可转化成果</h6><h3 class="mb-0">391 <small class="fs-6">项</small></h3></div></div></div>
                    <div class="col-6 col-md-3"><div class="card bg-warning text-dark border-0 shadow-sm h-100"><div class="card-body p-3"><h6 class="text-dark-50 small">中试基金规模</h6><h3 class="mb-0">50 <small class="fs-6">亿元</small></h3></div></div></div>
                    <div class="col-6 col-md-3"><div class="card bg-info text-white border-0 shadow-sm h-100"><div class="card-body p-3"><h6 class="text-white-50 small">成功对接项目</h6><h3 class="mb-0">45 <small class="fs-6">个</small></h3></div></div></div>
                </div>
            </div>

            <!-- 2. 高校端 -->
            <div id="view-uni" class="view-section d-none fade-in">
                <h4 class="mb-4 fw-bold"><i class="bi bi-mortarboard-fill text-success me-2"></i>高校端工作台</h4>
                <div class="row g-3">
                    <div class="col-12 col-xl-5">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white fw-bold border-bottom-0 pt-3">发布新成果</div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label text-muted small">成果名称</label>
                                    <input type="text" id="uni-form-title" class="form-control" placeholder="如: 高效光伏材料">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-muted small">成熟度</label>
                                    <select id="uni-form-level" class="form-select">
                                        <option value="实验室阶段">实验室阶段</option>
                                        <option value="中试阶段">中试阶段</option>
                                        <option value="具备产业化条件">具备产业化条件</option>
                                    </select>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted small">标签分类</label>
                                    <input type="text" id="uni-form-tag" class="form-control" placeholder="如: 【前沿探索型】">
                                </div>
                                <button class="btn btn-success w-100" onclick="publishAchievement()">提交发布</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-xl-7">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center pt-3 border-bottom-0 flex-wrap gap-2">
                                <span class="fw-bold">智能匹配央企需求</span>
                                <input type="text" class="form-control form-control-sm w-auto" placeholder="搜索关键词..." onkeyup="filterList(this, 'uni-demand-list')">
                            </div>
                            <div class="card-body p-0" style="max-height: 500px; overflow-y: auto;">
                                <ul class="list-group list-group-flush" id="uni-demand-list">
                                    <!-- JS 渲染 -->
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. 央企端 -->
            <div id="view-soe" class="view-section d-none fade-in">
                <h4 class="mb-4 fw-bold"><i class="bi bi-building-fill text-info me-2"></i>央企端工作台</h4>
                <div class="row g-3">
                    <div class="col-12 col-xl-5">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white fw-bold border-bottom-0 pt-3">发布技术痛点 (需求)</div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label text-muted small">需求命题</label>
                                    <input type="text" id="soe-form-title" class="form-control" placeholder="如: 大飞机用铝材残余应力控制">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-muted small">拟投入资金</label>
                                    <input type="text" id="soe-form-budget" class="form-control" placeholder="如: 500万">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted small">标签分类</label>
                                    <input type="text" id="soe-form-tag" class="form-control" placeholder="如: 【技术攻坚型】">
                                </div>
                                <button class="btn btn-primary w-100" onclick="publishDemand()">发布榜单</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-xl-7">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center pt-3 border-bottom-0 flex-wrap gap-2">
                                <span class="fw-bold"><i class="bi bi-lightbulb-fill text-warning me-2"></i>推荐高校成果</span>
                                <input type="text" class="form-control form-control-sm w-auto" placeholder="搜索专利..." onkeyup="filterList(this, 'soe-result-list')">
                            </div>
                            <div class="card-body p-0" style="max-height: 500px; overflow-y: auto;">
                                <ul class="list-group list-group-flush" id="soe-result-list">
                                    <!-- JS 渲染 -->
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. 管委会端 -->
            <div id="view-gov" class="view-section d-none fade-in">
                <h4 class="mb-4 fw-bold"><i class="bi bi-bank2 text-danger me-2"></i>管委会驾驶舱</h4>
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold pt-3 pb-3">全流程对接监控 (点击按钮推进状态)</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 text-nowrap">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">协同项目名称</th>
                                        <th>供给方(高校)</th>
                                        <th>需求方(央企)</th>
                                        <th>当前所处阶段</th>
                                        <th>管委会介入</th>
                                    </tr>
                                </thead>
                                <tbody id="gov-table-body">
                                    <!-- JS 渲染 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 必须引入 Bootstrap JS 以支持弹窗 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
